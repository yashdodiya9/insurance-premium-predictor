[project]
name = "5-fastapi-project"
version = "0.1.0"
description = "FastAPI service and Streamlit app that predict an insurance premium category"
readme = "README.md"
authors = [
    { name = "Yash Dodiya", email = "dodiyayash28@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]